name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # node-sass ^4.12 only supports Node 14; the Linux x64 prebuilt binary
      # avoids the arm64/newer-Node build problems we hit locally.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 14
      # sharp@0.23 (a Gatsby v2 dep) has no Node 14 prebuilt, so it compiles via
      # node-gyp, whose bundled gyp uses the 'rU' file mode removed in Python
      # 3.11+. Pin Python 3.10 and point node-gyp at it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PYTHON: python3.10
      - name: Build (with path prefix for project site)
        run: npx gatsby build --prefix-paths
        env:
          CI: "false"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
